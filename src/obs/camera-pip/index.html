<!doctype html>
<!--
  Moldura de apresentação + câmera PIP (OBS) — overlay 1920x1080
  transparente: uma moldura sólida (fundo azul da marca) em volta de uma
  janela de apresentação MENOR que a tela toda, com a câmera cobrindo uma
  fatia pequena da própria apresentação (canto inferior esquerdo ou
  direito, ?lado=esquerda|direita — padrão esquerda). Sem selo/etiqueta
  "COMAPE" desta vez, só a moldura.

  Área de conteúdo (onde a apresentação/tela compartilhada deve ficar por
  baixo, mesma pra ambas as variantes): x=160, y=90, largura=1600, altura=900

  Área da câmera (por cima da apresentação, perto do canto inferior):
    esquerda: x=184,  y=696, largura=420, altura=270
    direita:  x=1316, y=696, largura=420, altura=270
-->
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <title>OBS · Moldura de apresentação + câmera PIP</title>
  <style>
    :root {
      --cor-primaria-900: #12477a;
      --cor-destaque-500: #df7f19;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
    }

    body {
      position: relative;
    }

    /* Moldura sólida: preenche a tela inteira; a "janela" da apresentação
       (menor que a tela) é o único recorte transparente, feito com 4
       tiras opacas em vez de um furo de verdade — mais simples e robusto
       que clip-path/mask pra um retângulo reto. */
    .tira {
      position: absolute;
      background: var(--cor-primaria-900);
    }

    .tira.topo {
      top: 0;
      left: 0;
      right: 0;
      height: 90px;
    }

    .tira.base {
      bottom: 0;
      left: 0;
      right: 0;
      height: 90px;
      /* 1080 - 90 (topo) - 900 (conteúdo) = 90: cobre a partir de onde a
         apresentação termina (y=990) até o fim da tela. A câmera fica
         POR CIMA da apresentação (dentro dos 900px de altura dela, ver
         .quadro abaixo), não precisa de mais espaço aqui embaixo. */
    }

    .tira.esquerda {
      top: 90px;
      left: 0;
      width: 160px;
      height: 900px;
    }

    .tira.direita {
      top: 90px;
      right: 0;
      width: 160px;
      height: 900px;
    }

    /* Contorno fino de destaque em volta da janela de apresentação. */
    .moldura-conteudo {
      position: absolute;
      left: 160px;
      top: 90px;
      width: 1600px;
      height: 900px;
      border: 3px solid var(--cor-destaque-500);
      box-sizing: border-box;
      pointer-events: none;
    }

    /* Câmera — mesma técnica de content-box + borda pra fora usada na
       moldura de câmera estática (ver preparacao/obs/_gerar): width/height
       aqui já SÃO a área de conteúdo (câmera), a borda cresce por fora.
       "top"/"left" (posição do box, borda incluída) = coordenada de
       conteúdo documentada no cabeçalho do arquivo MENOS a borda (6px). */
    .quadro {
      position: absolute;
      box-sizing: content-box;
      width: 420px;
      height: 270px;
      top: 690px;
      /* 696 - 6 */
      border: 6px solid var(--cor-primaria-900);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    body.esquerda .quadro {
      left: 178px;
      /* 184 - 6 */
    }

    body.direita .quadro {
      left: 1310px;
      /* 1316 - 6 */
    }
  </style>
</head>

<body class="esquerda">
  <div class="tira topo"></div>
  <div class="tira base"></div>
  <div class="tira esquerda"></div>
  <div class="tira direita"></div>
  <div class="moldura-conteudo"></div>
  <div class="quadro"></div>

  <script>
    const params = new URLSearchParams(location.search);
    if (params.get("lado") === "direita") {
      document.body.classList.remove("esquerda");
      document.body.classList.add("direita");
    }
  </script>
</body>

</html>
