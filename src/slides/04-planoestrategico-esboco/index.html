<!doctype html>
<!--
  Plano Estratégico PPGMUS 2025-2028 — esboço (4º Fórum COMAPE) — mesmo
  formato/layout dos decks em ../01-quadrienal-25-28/, ../02-questoes-gts/
  e ../03-proposta-processo-seletivo/ (reveal.js + tema-comape.css
  compartilhado).

  Diferença: destaques usam a biblioteca Rough Notation (efeito "feito à
  mão" — grifo, sublinhado, caixa), em vez de <mark data-color> como nos
  outros decks. Ver função anotarSlideAtual() abaixo.

  Como apresentar: abra este arquivo no Chrome e use as setas/espaço para
  navegar (ESC = visão geral, 's' = modo apresentador).

  Como exportar em PDF: abra com "?print-pdf" no final da URL
  (index.html?print-pdf) e use Cmd/Ctrl+P → "Salvar como PDF", com
  "Gráficos de plano de fundo" ativado e margens "Nenhuma". As anotações
  Rough Notation são desenhadas em <svg> absoluto — vale conferir se saem
  no PDF (não testado ainda).
-->
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plano Estratégico PPGMUS 2025-2028 — esboço</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/white.css">
  <link rel="stylesheet" href="../tema-comape.css">
</head>

<body>
  <div class="reveal">
    <div class="slides" id="slides-root"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/rough-notation@0.5.1/lib/rough-notation.iife.js"></script>
  <script src="dados.js"></script>
  <script>
    // Mesma técnica de variantes estáticas do ícone usada nos outros
    // decks — reaproveita os PNGs já gerados em ../assets/logo-variantes/
    // (pasta compartilhada entre decks).
    const LOGO_VARIANTES_N = 30;
    const LOGO_VARIANTES = Array.from(
      { length: LOGO_VARIANTES_N },
      (_, v) => `../assets/logo-variantes/logo-variante-${v}.png`
    );
    function logoAleatorio() {
      return LOGO_VARIANTES[Math.floor(Math.random() * LOGO_VARIANTES.length)];
    }
    const EVENTO_LABEL =
      "4º Fórum de Autoavaliação e Planejamento Estratégico - PPGMUS/UFMG";

    // Cabeçalho de cada slide de conteúdo — mesma estrutura dos outros
    // decks, sem a lógica de "Fonte"/"Elaboração" (esboço da própria
    // COMAPE, não dado de terceiro).
    function elHeader(secaoTitulo) {
      return `
        <div class="slide-header">
          <div class="slide-header-evento">
            <img class="slide-header-logo" src="${logoAleatorio()}" alt="">
            <span class="evento-titulo">${EVENTO_LABEL}</span>
          </div>
          <div class="slide-header-meta">
            <div class="slide-secao-marca">${secaoTitulo}</div>
          </div>
        </div>`;
    }

    function fragUl(itens, classe) {
      const itemHtml = (it) =>
        typeof it === "string"
          ? `<li>${it}</li>`
          : `<li>${it.text}<ul>${it.sub.map(itemHtml).join("")}</ul></li>`;
      return `<ul${classe ? ` class="${classe}"` : ""}>${itens
        .map(itemHtml)
        .join("")}</ul>`;
    }

    // ---------------------------------------------------------------------
    // Slide de título / índice / divisor de seção
    // ---------------------------------------------------------------------

    function buildTitleSlide() {
      return `
        <section class="slide-titulo">
          <img class="logo-forum-canto" src="${logoAleatorio()}" alt="">
          <h1>${DECK.deck.title}</h1>
          <p class="subtitulo">${DECK.deck.subtitle}</p>
          <p class="autoria">${DECK.deck.autores}</p>
          <p class="autoria-meta">${DECK.deck.local} · ${DECK.deck.data}</p>
        </section>`;
    }

    // Índice/percurso da apresentação, logo após a capa — mesma função de
    // ../01-quadrienal-25-28/index.html. Usa <div>, não <ol>/<li> (um
    // <ol> real perde a guerra de especificidade contra as regras de
    // lista do tema padrão do reveal.js, que fixam display:block).
    function buildIndiceSlide(secoes) {
      return `
        <section class="slide-indice-layout">
          ${elHeader("Sumário")}
          <h2>Percurso da apresentação</h2>
          <div class="indice-lista">
            ${secoes
          .map(
            (secao, i) => `
            <div class="indice-item">
              <span class="indice-numero">${i + 1}</span>
              <span class="indice-conteudo">
                <span class="indice-titulo">${secao.title}</span>
                ${secao.resumo ? `<span class="indice-resumo">${secao.resumo}</span>` : ""}
              </span>
            </div>`
          )
          .join("")}
          </div>
        </section>`;
    }

    function buildSectionDividerSlide(secao) {
      return `
        <section class="slide-secao">
          <h1>${secao.title}</h1>
        </section>`;
    }

    // ---------------------------------------------------------------------
    // Um <section> por "kind" de slide
    // ---------------------------------------------------------------------

    function buildConceptSlide(slide, secaoTitulo) {
      return `
        <section>
          ${elHeader(secaoTitulo)}
          <h2>${slide.title}</h2>
          ${fragUl(slide.body)}
        </section>`;
    }

    // Relação entre os eixos estratégicos e os quesitos da nova ficha: uma
    // lista simples com os eixos à esquerda e, à direita de cada um, uma
    // etiqueta (selo) menor com o número e o nome do quesito da CAPES. O
    // número do eixo usa a cor do eixo; o nome ganha um destaque (grifo de
    // caneta marcadora, via Rough Notation) na mesma cor, translúcida pra
    // não esconder o texto.
    function corComAlfa(hex, alfa) {
      const n = parseInt(hex.slice(1), 16);
      const r = (n >> 16) & 255;
      const g = (n >> 8) & 255;
      const b = n & 255;
      return `rgba(${r}, ${g}, ${b}, ${alfa})`;
    }

    function buildEixosQuesitosSlide(slide, secaoTitulo) {
      return `
        <section class="slide-eixos-quesitos-layout">
          ${elHeader(secaoTitulo)}
          <h2>${slide.title}</h2>
          ${slide.descricao ? `<p class="eixos-quesitos-descricao">${slide.descricao}</p>` : ""}
          <div class="eixos-quesitos-lista">
            ${slide.eixos
          .map(
            (e) => `
            <div class="eixo-linha">
              <div class="eixo-linha-numero" style="background:${e.cor}">${e.numero}</div>
              <div class="eixo-linha-nome"><span class="rn" data-tipo="highlight" data-cor="${corComAlfa(e.cor, 0.25)}">${e.nome}</span></div>
              <div class="eixo-linha-tag">
                <span class="eixo-linha-tag-quesito">${e.quesito.cod}. ${e.quesito.nome}</span>
                <span class="eixo-linha-tag-cap">(CAPES 25-28)</span>
              </div>
            </div>`
          )
          .join("")}
          </div>
        </section>`;
    }

    // Lista numerada de considerações — mesmo renderer de
    // ../01-quadrienal-25-28/index.html (slides 4.4b/4.4c), com um campo
    // novo opcional "corEixo" que tinge o círculo do número na cor do
    // eixo (sem isso, cai na cor padrão via CSS).
    function buildChangesSlide(slide, secaoTitulo) {
      return `
        <section class="slide-mudancas-layout">
          ${elHeader(secaoTitulo)}
          <h2>${slide.title}</h2>
          <div class="consideracoes-lista">
            ${slide.consideracoes
          .map(
            (c, i) => `
              <div class="consideracao-item">
                <div class="consideracao-numero"${slide.corEixo ? ` style="background:${slide.corEixo}"` : ""}>${i + 1}</div>
                <div class="consideracao-texto">${c}</div>
              </div>`
          )
          .join("")}
          </div>
        </section>`;
    }

    // Ação do Plano Estratégico, com a estrutura fixa do documento:
    // subtítulo (código + nome), Meta, Estratégias e Aferimento (a antiga
    // "Avaliação", renomeada). Ações ainda em elaboração usam o campo
    // "pendentes" (lista) em vez de Meta/Estratégias/Aferimento.
    function buildAcaoSlide(slide, secaoTitulo) {
      const cor = slide.corEixo || "var(--cor-primaria-500)";
      const rotulo = (texto) => `<div class="acao-rotulo" style="color:${cor}">${texto}</div>`;
      const lista = (itens) =>
        `<ul class="acao-lista">${itens.map((t) => `<li>${t}</li>`).join("")}</ul>`;

      let corpo;
      if (slide.pendentes) {
        corpo = `
          <div class="acao-bloco">
            ${rotulo("Ações ainda a detalhar")}
            ${lista(slide.pendentes)}
          </div>`;
      } else {
        corpo = `
          <div class="acao-bloco">
            ${rotulo("Meta")}
            <p class="acao-meta-texto" style="border-left-color:${cor}">${slide.meta}</p>
          </div>
          <div class="acao-bloco">
            ${rotulo("Estratégias")}
            ${lista(slide.estrategias)}
          </div>
          <div class="acao-bloco">
            ${rotulo("Aferimento")}
            ${lista(slide.aferimento)}
          </div>`;
      }

      // Título na cor do eixo + grifo Rough Notation (translúcido, mesma
      // técnica de corComAlfa() já usada no nome do eixo em
      // buildEixosQuesitosSlide) — só quando o slide tem corEixo de verdade
      // (hex), pra não passar "var(--cor-primaria-500)" pro parser de cor.
      const tituloTexto = `${slide.cod ? `<span class="acao-cod">${slide.cod}</span> ` : ""}${slide.titulo}`;
      const titulo = slide.corEixo
        ? `<span class="rn" data-tipo="highlight" data-cor="${corComAlfa(slide.corEixo, 0.22)}" style="color:${slide.corEixo}">${tituloTexto}</span>`
        : tituloTexto;

      return `
        <section class="slide-acao-layout">
          ${elHeader(secaoTitulo)}
          <h2>${titulo}</h2>
          <div class="acao-blocos">${corpo}</div>
        </section>`;
    }

    function buildSlide(slide, secaoTitulo) {
      switch (slide.kind) {
        case "concept":
          return buildConceptSlide(slide, secaoTitulo);
        case "eixos-quesitos":
          return buildEixosQuesitosSlide(slide, secaoTitulo);
        case "changes":
          return buildChangesSlide(slide, secaoTitulo);
        case "acao":
          return buildAcaoSlide(slide, secaoTitulo);
        default:
          console.warn("kind desconhecido:", slide.kind);
          return "";
      }
    }

    // ---------------------------------------------------------------------
    // Monta o deck inteiro e inicializa o reveal.js
    // ---------------------------------------------------------------------

    function montarDeck() {
      const secoes = DECK.deck.sections;
      let html = buildTitleSlide();
      html += buildIndiceSlide(secoes);

      secoes.forEach((secao) => {
        html += buildSectionDividerSlide(secao);
        secao.slides.forEach((slide) => {
          html += buildSlide(slide, secao.title);
        });
      });

      document.getElementById("slides-root").innerHTML = html;
    }

    // ---------------------------------------------------------------------
    // Rough Notation — anota <span class="rn" data-tipo="..."
    // data-cor="..."> do slide corrente, de forma preguiçosa (só na
    // primeira vez que o slide vira "present"). Feito sob demanda em vez
    // de tudo de uma vez no carregamento porque o reveal.js ainda pode
    // estar ajustando a escala do deck (largura/altura fixas + CSS
    // transform) logo após montarDeck(); esperar 'ready'/'slidechanged'
    // evita anotações desenhadas com o layout errado.
    const rnAnotados = new WeakSet();
    function anotarSlideAtual() {
      const slideAtual = document.querySelector(".reveal .slides section.present");
      if (!slideAtual) return;
      slideAtual.querySelectorAll(".rn").forEach((el) => {
        if (rnAnotados.has(el)) return;
        const tipo = el.dataset.tipo || "highlight";
        const cor = el.dataset.cor || "#f17807";
        const anotacao = RoughNotation.annotate(el, {
          type: tipo,
          color: cor,
          strokeWidth: tipo === "highlight" ? 1.5 : 2.5,
          padding: tipo === "highlight" ? [1, 3] : 4,
          multiline: true,
          animationDuration: 700,
        });
        anotacao.show();
        compensarEscalaReveal(el);
        rnAnotados.add(el);
      });
    }

    // Rough Notation mede as posições com getBoundingClientRect() (já na
    // escala visual aplicada pelo reveal.js via transform), mas desenha o
    // <svg> dentro da própria <section> escalada. Com o deck reduzido
    // (escala != 1), o desenho sai deslocado/encolhido em direção ao canto
    // superior esquerdo do bloco. Aplica scale(1/escala) no <svg> (origem
    // 0,0) para anular a escala e fazer o traço cair sobre o texto.
    function compensarEscalaReveal(el) {
      const escala = Reveal.getScale();
      if (!escala || Math.abs(escala - 1) < 0.001) return;
      const prev = el.previousElementSibling;
      const next = el.nextElementSibling;
      const svg =
        (prev && prev.classList && prev.classList.contains("rough-annotation") && prev) ||
        (next && next.classList && next.classList.contains("rough-annotation") && next);
      if (!svg) return;
      svg.style.transformOrigin = "0 0";
      svg.style.transform = `scale(${1 / escala})`;
    }

    function definirMetadadosDocumento() {
      document.title = `${DECK.deck.title} — ${DECK.deck.autores}, ${DECK.deck.ano}`;
      const metaAutor = document.createElement("meta");
      metaAutor.name = "author";
      metaAutor.content = DECK.deck.autores;
      document.head.appendChild(metaAutor);
    }

    definirMetadadosDocumento();
    montarDeck();

    // Sinal pra automação externa (ex.: exportação de PDF via CDP) saber
    // que o deck já terminou de montar — mesma técnica de polling
    // determinístico usada nos outros decks.
    window.DECK_PRONTO = true;

    Reveal.initialize({
      hash: true,
      width: 1280,
      height: 720,
      margin: 0.06,
      controls: true,
      progress: true,
      center: false,
      transition: "slide",
    }).then(() => {
      // Espera a fonte Poppins carregar antes de anotar: se o texto ainda
      // está no fallback do sistema quando o Rough Notation mede a
      // posição do <span>, a troca de fonte (FOUT) reflui o texto depois
      // e desalinha o grifo/sublinhado (visto na prática: anotações cada
      // vez mais deslocadas à direita ao longo da frase).
      const fontesProntas = document.fonts ? document.fonts.ready : Promise.resolve();
      fontesProntas.then(() => {
        anotarSlideAtual();
        Reveal.on("slidechanged", anotarSlideAtual);
      });
    });
  </script>
</body>

</html>
